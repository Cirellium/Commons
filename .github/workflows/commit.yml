name: Build Commons JARs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java: [ "23" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build & verify with Maven Wrapper
        run: |
          ./mvnw -B -T 1C verify \
                 -DskipTests -Dsurefire.skip=true \
                 -Dmaven.javadoc.skip=true \
                 -Dmdep.analyze.skip=true

      - name: Collect JARs
        run: |
          mkdir -p build
          find commons platform -path '*/target/*.jar' -type f -exec cp {} build/ \; || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commons-jars-jdk${{ matrix.java }}
          path: build
